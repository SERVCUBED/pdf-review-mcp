name: ci

on:
  push:
  pull_request:

# Least privilege: read-only repository access, no secrets, no publishing or deployment.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Linux, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # Pinned to major versions of the official actions. Pin to full commit SHAs if your
      # policy requires it (see README "Publishing checklist").
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (development)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build

      - name: Unit and protocol tests
        run: python -m pytest -q

      - name: Build wheel and sdist
        run: python -m build --outdir dist

      - name: Install built wheel into a clean venv (non-editable)
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/pdf-review-mcp --version

      - name: Stdio smoke test against the installed wheel (temporary PDF + key dir)
        run: python scripts/smoke_test.py --command /tmp/wheel-venv/bin/pdf-review-mcp
