[project]
name = "pdf-review-mcp"
version = "1.0.0rc1"
description = "Local stdio MCP server for human/agent review of PDF annotation comments on the original comment"
readme = "README.md"
requires-python = ">=3.11"
# Mixed work: software AGPL-3.0-or-later, documentation CC-BY-SA-4.0 (see LICENSING.md, REUSE.toml).
license = "AGPL-3.0-or-later AND CC-BY-SA-4.0"
license-files = ["LICENSE", "LICENSES/*.txt", "LICENSING.md", "THIRD_PARTY_NOTICES.md", "REUSE.toml"]
authors = [{ name = "Ben Blain" }]
dependencies = [
    "fastmcp>=4.1,<5",   # tested: 4.1.7, 4.1.8
    "pymupdf>=1.26,<3",  # tested: 2.1
    "portalocker==4.4.2",  # exact: open-guard hook reviewed only for 4.4.2; upgrades need review
]
keywords = ["mcp", "pdf", "annotations", "review", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
pdf-review-mcp = "pdf_review_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",          # tested: 9.2.0
    "pytest-asyncio>=1.0,<2",   # tested: 1.4.1.post1
]

[build-system]
requires = ["hatchling>=1.27,<2"]  # PEP 639 license metadata
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_review_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/pdf_review_mcp",
    "/tests",
    "/scripts/smoke_test.py",
    "/examples",
    "/docs",
    "/README.md",
    "/AGENTS.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/LICENSES",
    "/LICENSING.md",
    "/THIRD_PARTY_NOTICES.md",
    "/REUSE.toml",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
